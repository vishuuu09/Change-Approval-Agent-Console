services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: changes
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d changes"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/changes
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-change-me-demo}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
